{% load i18n static %}
{% extends "base.html" %}
{% block content %}
<section class="min-h-screen flex items-center justify-center px-5">
    <div class="text-center space-y-6">
        <p class="font-ibm-plex-mono text-[0.75rem] tracking-[0.12em] uppercase text-copal-green">{% trans "ERREUR" %}</p>
        <h1 class="font-suez text-[6rem] leading-none">404</h1>
        <h2 class="font-suez text-[1.5rem]">{% trans "Page non trouvee" %}</h2>
        <p class="text-copal-gray-500 max-w-[400px] mx-auto leading-[1.6]">
            {% trans "La page que vous recherchez n'existe pas ou a ete deplacee." %}
        </p>
        <div class="pt-2">
            <a href="{% url 'portfolio:home' %}" class="inline-flex items-center justify-center gap-2 px-6 py-3 font-medium tracking-wide transition-all duration-200 rounded-md cursor-pointer font-space-grotesk text-[0.875rem] tracking-[0.05em] uppercase bg-copal-green text-white border-2 border-copal-green hover:bg-copal-green-dark hover:border-copal-green-dark hover:shadow-[0_4px_14px_rgba(21,163,74,0.25)] hover:-translate-y-px">
                {% trans "ALLER A L'ACCUEIL" %}
            </a>
        </div>
    </div>
</section>
{% endblock %}
