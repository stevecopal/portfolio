{% extends "base.html" %}
{% load static i18n %}

{% block content %}
<section class="flex min-h-screen items-center justify-center bg-bone px-5 py-24">
    <div class="text-center">
        <span class="eyebrow">{% trans "Erreur" %}</span>
        <h1 class="display-xl mt-7">404</h1>
        <h2 class="display-md mt-5 text-ink/45">{% trans "Cette page n'existe pas" %}</h2>
        <p class="lead mx-auto mt-5 max-w-sm">{% trans "La page que vous recherchez a ete deplacee, supprimee ou n'a jamais existe." %}</p>
        <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
            <a href="{% url 'portfolio:home' %}" class="btn btn-solid">
                {% trans "Aller à l'accueil" %}
            </a>
            <a href="{% url 'portfolio:contact' %}" class="btn btn-outline">
                {% trans "Me contacter" %}
            </a>
        </div>
    </div>
</section>
{% endblock %}
