{% extends "base.html" %}
{% load static i18n %}

{% block content %}
<section class="min-h-screen flex items-center justify-center px-6">
    <div class="text-center space-y-8">
        <h1 class="text-8xl md:text-9xl font-space-grotesk font-bold">404</h1>
        <h2 class="text-2xl md:text-3xl font-space-grotesk font-semibold">{% trans "This page doesn't exist" %}</h2>
        <p class="text-gray-600 max-w-md mx-auto">{% trans "The page you're looking for has been moved, deleted, or never existed." %}</p>
        <div class="flex flex-col sm:flex-row justify-center space-y-4 sm:space-y-0 sm:space-x-4">
            <a href="{% url 'portfolio:home' %}" class="px-6 py-3 border border-black text-black font-space-grotesk tracking-wider hover:bg-black hover:text-white transition-colors">
                {% trans "GO HOME" %}
            </a>
            <a href="{% url 'portfolio:contact' %}" class="px-6 py-3 bg-black text-white font-space-grotesk tracking-wider hover:bg-gray-800 transition-colors">
                {% trans "CONTACT ME" %}
            </a>
        </div>
    </div>
</section>
{% endblock %}
