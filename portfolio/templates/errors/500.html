{% extends "base.html" %}
{% load static i18n %}

{% block content %}
<section class="min-h-screen flex items-center justify-center px-5">
    <div class="text-center space-y-6">
        <p style="font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: #15A34A;">{% trans "ERREUR" %}</p>
        <h1 style="font-family: var(--font-primary); font-size: 6rem; line-height: 1;">500</h1>
        <h2 style="font-family: var(--font-primary); font-size: 1.5rem;">{% trans "Erreur serveur" %}</h2>
        <p style="color: #6C757D; max-width: 400px; margin: 0 auto; line-height: 1.6;">{% trans "Une erreur s'est produite. Veuillez reessayer plus tard." %}</p>
        <div class="flex flex-col sm:flex-row justify-center gap-3 pt-2">
            <a href="{% url 'portfolio:home' %}" class="btn-outline">
                {% trans "ALLER A L'ACCUEIL" %}
            </a>
            <a href="{% url 'portfolio:contact' %}" class="btn-primary">
                {% trans "ME CONTACTER" %}
            </a>
        </div>
    </div>
</section>
{% endblock %}
